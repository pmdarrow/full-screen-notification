name: FullScreenNotification
include:
  - path: project.local.yml
    required: false
options:
  bundleIdPrefix: com.fullscreennotification
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"

packages:
  AppAuth:
    url: https://github.com/openid/AppAuth-iOS
    from: 2.0.0

targets:
  FullScreenNotification:
    type: application
    platform: macOS
    sources:
      - path: FullScreenNotification
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fullscreennotification.app
        INFOPLIST_FILE: FullScreenNotification/Info.plist
        CODE_SIGN_ENTITLEMENTS: FullScreenNotification/FullScreenNotification.entitlements
        CODE_SIGN_STYLE: Automatic
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: Full Screen Notification
        PRODUCT_MODULE_NAME: FullScreenNotification
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.0.7"
        CURRENT_PROJECT_VERSION: 8
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: AppAuth

  FullScreenNotificationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FullScreenNotificationTests
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: true
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.fullscreennotification.app.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Full Screen Notification.app/Contents/MacOS/Full Screen Notification"
    dependencies:
      - target: FullScreenNotification
      - package: AppAuth

schemes:
  FullScreenNotification:
    build:
      targets:
        FullScreenNotification: all
        FullScreenNotificationTests: [test]
    test:
      targets:
        - FullScreenNotificationTests
